services:
  - type: web
    name: autoassure-api
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: mvn -q clean package -DskipTests
    startCommand: java -jar target/api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
