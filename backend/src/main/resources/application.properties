spring.application.name=autoassure-api
server.port=${PORT:8080}

# Real secrets (API keys, passwords) live in application-secrets.properties, which is
# gitignored and never committed. See application-secrets.properties.example for the format.
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=jdbc:h2:file:./data/autoassure;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Resend (https://resend.com) sends the lead notification email over HTTPS instead of
# raw SMTP, since this network intercepts/blocks the SMTP protocol even on open ports.
# Sign up, create an API key, and paste it below in place of the empty default.
resend.api-key=${RESEND_API_KEY:}
resend.from=AutoAssure <onboarding@resend.dev>

app.mail.to=udayr9154@gmail.com
